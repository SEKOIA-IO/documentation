[files]
ignore-hidden = true
ignore-dot = true
extend-exclude = ["docs/assets", "docs/javascript"]

[default]
# Ignore whole lines containing UUIDs to avoid false positives on UUID fragments
# (e.g. `dbe` from `...-5dbe-...` in generated include paths).
extend-ignore-re = [
	"(?mi)^.*[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}.*$",
]
# Also treat UUID-shaped identifiers as valid tokens when parsed as identifiers.
extend-ignore-identifiers-re = [
	"(?i)\\b[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}\\b",
]

[default.extend-words]
# "HashiCorp" is split into "Hashi" + "Corp"
Hashi = "Hashi"

[default.extend-identifiers]
# Exact, case-sensitive identifiers from integration pages (lowercase typos such as "ot" stay flagged)
# "SecurID" (RSA) would otherwise be split into "Secur" + "ID"
SecurID = "SecurID"
# "SIEMs" would otherwise be split into "SIE" + "Ms"
SIEMs = "SIEMs"
# "OT" stands for operational technology
OT = "OT"
# SecurityScorecard VAS format name, and its page file name
VAS = "VAS"
securityscorecard_vas = "securityscorecard_vas"

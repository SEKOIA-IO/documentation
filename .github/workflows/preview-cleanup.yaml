name: Ask preview removal for a given PR

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Save PR number
        run: |
          mkdir PR
          echo ${{ github.event.number }} > ./PR/PR_NUMBER

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PR
          path: PR/
